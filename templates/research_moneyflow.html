<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资金流向背离监测 - 持仓工作台</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261108a">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        .page { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: #fff; padding: 12px 18px; border-radius: 12px; margin-bottom: 12px;
            display: flex; align-items: baseline; justify-content: center; gap: 12px; flex-wrap: wrap;
        }
        .header h1 { font-size: 16px; margin: 0; }
        .header p { display: none; }
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .kpi {
            background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;
        }
        .kpi .v { font-size: 26px; font-weight: 800; color: var(--accent); }
        .kpi .l { font-size: 12px; color: #64748b; margin-top: 4px; }
        .signal-box {
            background: #fff; border: 2px solid rgba(217,45,32,0.35); border-left: 5px solid var(--red);
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 16px 20px; margin-bottom: 20px;
        }
        .signal-box h3 { margin: 0 0 6px; color: var(--red); font-size: 15px; }
        .signal-box p { margin: 0 0 10px; font-size: 12px; color: #64748b; }
        table.data-table {
            width: 100%; border-collapse: collapse; background: #fff;
            border: 2px solid #e2e8f0; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        .data-table th { background: var(--accent); color: #fff; padding: 10px 10px; font-size: 12px; text-align: left; }
        .data-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid #f1f5f9; }
        .data-table tr:hover { background: #f8f7ff; }
        .up { color: var(--red); font-weight: 600; } .down { color: var(--green); font-weight: 600; }
        .scan-bar {
            background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            margin-bottom: 16px; font-size: 13px; color: #64748b;
        }
        .scan-btn {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: #fff;
            border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        h3.sec { color: #334155; font-size: 15px; margin: 18px 0 10px; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7c2-2 4-2 6 0s4 2 6 0 4-2 6 0 M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0 M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg> 资金流向背离监测</h1>
            <p>股价下跌 + 主力净流入 = 逆势吸筹信号（contrarian）</p>
        </div>
        <nav class="mobile-quicknav" aria-label="页面快捷导航">
            <a href="/?pwd={{ pwd }}">持仓</a>
            <a href="/quant?pwd={{ pwd }}">信号中心</a>
            <a href="/backtest?pwd={{ pwd }}">回测</a>
            <a href="/research?pwd={{ pwd }}" class="on">研究中心</a>
        </nav>
        <div class="scan-bar">
            <span id="meta">加载中...</span>
            <button class="scan-btn" id="refresh" type="button">立即刷新</button>
        </div>
        <div class="err-banner" id="err-banner" hidden></div>
        <div class="kpi-row">
            <div class="kpi"><div class="v" id="k-universe">-</div><div class="l">扫描股票数</div></div>
            <div class="kpi"><div class="v" id="k-signals" style="color:var(--red)">-</div><div class="l">背离信号数</div></div>
        </div>
        <div class="signal-box">
            <h3><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8Z"/></svg> 背离信号（跌 &gt;1% 且主力净流入占比 &gt;1.5% 且成交额 &gt;5000万，已剔除 ST/北交所/新股）</h3>
            <p>按主力净流入金额排序 · 信号强度：超大单+大单同时净流入最佳 · 交易时段（9:30-15:00）数据最可靠</p>
            <div class="table-scroll">
<table class="data-table">
                <thead><tr><th>代码</th><th>名称</th><th>现价</th><th>跌幅</th><th>主力净流入</th><th>净流入占比</th><th>超大单</th><th>大单</th><th>成交额</th></tr></thead>
                <tbody id="signals"><tr><td colspan="9" class="loading">加载中...</td></tr></tbody>
            </table>
</div>
        </div>
        <h3 class="sec"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18 M7 14l3-3 3 2 4-5 M17 8h3v3"/></svg> 主力净流入 TOP20（全市场）</h3>
        <div class="table-scroll">
<table class="data-table">
            <thead><tr><th>#</th><th>代码</th><th>名称</th><th>涨跌幅</th><th>主力净流入</th><th>净流入占比</th></tr></thead>
            <tbody id="top"><tr><td colspan="6" class="loading">加载中...</td></tr></tbody>
        </table>
</div>
    </div>
    <script>
        const pwd = "{{ pwd }}";
        async function load(refresh = false) {
            const btn = document.getElementById('refresh');
            btn.disabled = true;
            try {
                const r = await fetch(`/api/research/moneyflow?pwd=${pwd}` + (refresh ? '&refresh=1' : ''));
                const d = await r.json();
                if (!r.ok) throw new Error(d.detail || '加载失败');
                render(d);
                document.getElementById('meta').textContent = d.stale ? `刷新失败，展示 ${d.fetchedAt} 的缓存数据（${d.source || '东方财富'}）` : `更新于 ${d.fetchedAt} · 数据源 ${d.source || '东方财富'} · 缓存 5 分钟`;
            } catch (e) {
                document.getElementById('meta').textContent = '数据源暂不可用';
                const b = document.getElementById('err-banner');
                b.innerHTML = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17H2.5L12 3Z M12 10v4 M12 17.5v.5"></path></svg>数据源加载失败：${e.message}。<button id="err-retry" type="button">重试</button>`;
                b.hidden = false;
                document.getElementById('err-retry').addEventListener('click', () => load(true));
                document.getElementById('signals').innerHTML = '<tr><td colspan="9" class="loading">数据未就绪</td></tr>';
                document.getElementById('top').innerHTML = '<tr><td colspan="6" class="loading">数据未就绪</td></tr>';
            } finally { btn.disabled = false; }
        }
        function render(d) {
            document.getElementById('k-universe').textContent = d.universe ?? '-';
            document.getElementById('k-signals').textContent = d.signal_count ?? 0;
            document.getElementById('signals').innerHTML = (d.signals || []).map(s => `
                <tr>
                    <td>${s.code}</td><td style="font-weight:600">${s.name}</td><td>${s.price}</td>
                    <td class="down">${s.chg}%</td>
                    <td class="up">${s.main_inflow_wan >= 0 ? '+' : ''}${s.main_inflow_wan}万</td>
                    <td>${s.inflow_rate}%</td>
                    <td>${s.super_inflow_wan}万</td><td>${s.large_inflow_wan}万</td>
                    <td>${s.turnover_yi}亿</td>
                </tr>`).join('') || '<tr><td colspan="9" class="loading">当前无背离信号</td></tr>';
            document.getElementById('top').innerHTML = (d.inflow_top || []).map((s, i) => `
                <tr>
                    <td>${i + 1}</td><td>${s.code}</td><td style="font-weight:600">${s.name}</td>
                    <td class="${s.chg >= 0 ? 'up' : 'down'}">${s.chg}%</td>
                    <td class="up">+${s.main_inflow_wan}万</td><td>${s.inflow_rate}%</td>
                </tr>`).join('') || '<tr><td colspan="6" class="loading">暂无数据</td></tr>';
        }
        document.getElementById('refresh').addEventListener('click', () => load(true));
        load();
    </script>
</body>
</html>
