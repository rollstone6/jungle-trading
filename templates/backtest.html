<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测 - 持仓工作台</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261030g">
    <style>
        .backtest-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .backtest-header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .backtest-header h1 {
            font-size: 16px;
            margin: 0;
        }
        .backtest-header p { display: none; }
        
        .backtest-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .strategy-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
        }
        .strategy-card {
                position: relative;
                background: #fff;
                border: 1.5px solid #e2e2ee;
                border-radius: 10px;
                padding: 11px 13px;
                cursor: pointer;
                transition: border-color .2s, box-shadow .2s, background .2s;
            }
            .strategy-card:hover {
                border-color: var(--accent);
                box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
            }
            .strategy-card.selected {
                border-color: var(--accent);
                background: linear-gradient(135deg, rgba(102, 126, 234, 0.07), rgba(118, 75, 162, 0.07));
                box-shadow: 0 0 0 1px var(--accent) inset;
            }
            .strategy-card .sc-head {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 4px;
            }
            .strategy-card h3 {
                color: #1e293b;
                font-size: 13.5px;
                font-weight: 700;
                margin: 0;
                flex: 1;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .strategy-card.selected h3 { color: var(--accent); }
            .strategy-card p {
                color: #64748b;
                font-size: 12px;
                line-height: 1.5;
                margin: 0;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .strategy-card .sc-params {
                margin-top: 6px;
                font-size: 11px;
                color: #94a3b8;
                font-family: ui-monospace, Menlo, monospace;
            }
            .strategy-card .engine-badge {
                flex: none;
                background: rgba(102, 126, 234, 0.12);
                color: var(--accent);
                padding: 2px 8px;
                border-radius: 10px;
                font-size: 10.5px;
                font-weight: 600;
            }
            .strategy-card .engine-badge.vnpy { background: rgba(245, 158, 11, 0.13); color: #b45309; }
            .strategy-card .sc-check {
                position: absolute;
                top: -7px;
                right: -7px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: linear-gradient(135deg, var(--accent), var(--accent-2));
                color: #fff;
                font-size: 11px;
                line-height: 18px;
                text-align: center;
                display: none;
                box-shadow: 0 1px 4px rgba(102, 126, 234, 0.4);
            }
            .strategy-card.selected .sc-check { display: block; }
        .regime-card {
            background: #f8f7ff;
            border: 1px solid #e9e6ff;
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: #334155;
        }
        .regime-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }
        .regime-badge.ranging { background: #10b981; }
        .regime-badge.trending { background: var(--accent); }
        .regime-badge.squeeze { background: #f59e0b; }
        .regime-badge.neutral { background: #94a3b8; }
        .regime-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .regime-metrics span {
            background: #fff;
            border: 1px solid #e9e6ff;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
        }
        .regime-metrics b { color: var(--accent); }
        .regime-note { color: #64748b; margin: 6px 0 10px; line-height: 1.6; }
        .regime-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .regime-chip {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .regime-chip:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(var(--accent-rgb),0.4); }

        .run-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .run-button:hover {
            transform: scale(1.02);
        }
        
        .run-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            display: none;
        }
        
        .results-section.show {
            display: block;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .metric-card .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .metric-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .metric-card .value.positive {
            color: #10b981;
        }
        
        .metric-card .value.negative {
            color: #ef4444;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="backtest-container">
        <div class="backtest-header">
            <h1><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v6L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8V2 M8.5 2h7 M7 15h10"/></svg> 量化回测实验室</h1>
            <p>使用历史数据验证交易策略</p>
        </div>

        <nav class="mobile-quicknav" aria-label="页面快捷导航">
            <a href="/?pwd={{ pwd }}">持仓</a>
            <a href="/quant?pwd={{ pwd }}">信号中心</a>
            <a href="/backtest?pwd={{ pwd }}" class="on">回测</a>
            <a href="/research?pwd={{ pwd }}">研究中心</a>
        </nav>
        
        <!-- 回测表单 -->
        <div class="backtest-form">
            <div class="form-group">
                <label>选择股票</label>
                <select id="stock-select" aria-label="选择回测股票">
                    <option value="">请选择...</option>
                    <optgroup label="<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 7-7 M14 8h7v7"/></svg> 当前持仓">
                        {% for pos in positions %}
                        <option value="{{ pos.code }}">{{ pos.name }} ({{ pos.code }})</option>
                        {% endfor %}
                    </optgroup>
                    {% if quant_pool %}
                    <optgroup label="<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v6L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8V2 M8.5 2h7 M7 15h10"/></svg> 量化股票池（与 app/quant 策略共用）">
                        {% for s in quant_pool %}
                        <option value="{{ s.symbol }}">{{ s.name }} ({{ s.symbol }})</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                </select>
            </div>
            
            <div class="form-group">
                <label>K线周期</label>
                <select id="period-select" aria-label="回测周期">
                    <option value="1d">日线（约 1.5 年历史）</option>
                    <option value="60m">60 分钟（约 1 年）</option>
                    <option value="30m">30 分钟（约半年）</option>
                    <option value="15m">15 分钟（约 3 个月）</option>
                </select>
            </div>

            <div class="form-group" id="regime-group" style="display: none;">
                <label>走势分类（量化自动判断）</label>
                <div id="regime-card" class="regime-card"></div>
            </div>

            <div class="form-group">
                <label>选择策略 <small id="strategy-picked" style="color:#94a3b8; font-weight:400;"></small></label>
                <div class="strategy-cards" id="strategy-cards">
                    <!-- 动态加载 -->
                </div>
            </div>
            
            <div class="form-group">
                <label>初始资金 (¥)</label>
                <input type="number" id="initial-cash" value="100000" min="10000" step="10000">
            </div>

            <div class="form-group">
                <label>手续费率（单边）</label>
                <input type="number" id="commission" value="0.001" min="0" max="0.01" step="0.0001">
                <small style="color: #999; font-size: 12px;">默认 0.001（千一）；万一填 0.0001</small>
            </div>
            
            <button class="run-button" id="run-backtest" type="button">开始回测</button>
        </div>
        
        <!-- 加载状态 -->
        <div class="loading" id="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>正在运行回测，请稍候...</p>
        </div>
        
        <!-- 错误信息 -->
        <div class="error-message" id="error-message" style="display: none;"></div>
        
        <!-- 回测结果 -->
        <div class="results-section" id="results-section">
            <h2 style="margin-bottom: 12px;">回测结果</h2>
            <p id="period-info" style="color: #64748b; font-size: 14px; margin: 0 0 20px;"></p>
            <div class="results-grid" id="results-grid">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>
    
    <script>
        const pwd = "{{ pwd }}";
        let selectedStrategy = null;
        let selectedEngine = null;
        
        // 加载策略列表
        async function loadStrategies() {
            try {
                const response = await fetch(`/api/backtest/strategies?pwd=${pwd}`);
                const strategies = await response.json();
                
                const container = document.getElementById('strategy-cards');
                const fmtParams = p => Object.entries(p || {}).map(([k, v]) => `${k}=${v}`).join(' ');
                container.innerHTML = strategies.map(s => {
                    const vnpy = s.name.startsWith('vnpy');
                    return `
                    <div class="strategy-card" data-name="${s.name}" data-engine="${vnpy ? 'vnpy' : 'backtrader'}">
                        <span class="sc-check">✓</span>
                        <div class="sc-head">
                            <h3>${s.display_name}</h3>
                            <span class="engine-badge ${vnpy ? 'vnpy' : ''}">${vnpy ? 'vnpy' : 'Backtrader'}</span>
                        </div>
                        <p>${s.description}</p>
                        <div class="sc-params">${fmtParams(s.params)}</div>
                    </div>`;
                }).join('');
                
                // 绑定点击事件
                document.querySelectorAll('.strategy-card').forEach(card => {
                    card.addEventListener('click', function() {
                        document.querySelectorAll('.strategy-card').forEach(c => c.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedStrategy = this.dataset.name;
                        selectedEngine = this.dataset.engine;
                        const pk = document.getElementById('strategy-picked');
                        if (pk) pk.textContent = '· 已选：' + this.querySelector('h3').textContent;
                    });
                });
            } catch (error) {
                console.error('加载策略失败:', error);
            }
        }
        
        // 运行回测
        async function runBacktest() {
            const code = document.getElementById('stock-select').value;
            const period = document.getElementById('period-select').value;
            const initialCash = parseInt(document.getElementById('initial-cash').value);
            const commission = parseFloat(document.getElementById('commission').value) || 0.001;
            
            if (!code) {
                showError('请选择股票');
                return;
            }
            
            if (!selectedStrategy) {
                showError('请选择策略');
                return;
            }
            
            // 显示加载状态
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results-section').classList.remove('show');
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('run-backtest').disabled = true;
            
            try {
                const response = await fetch(`/api/backtest/run?pwd=${pwd}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        strategy: selectedStrategy,
                        initial_cash: initialCash,
                        engine: selectedEngine,
                        period: period,
                        commission: commission
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result);
                } else {
                    showError(result.error || '回测失败');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('run-backtest').disabled = false;
            }
        }
        
        // 显示结果
        function displayResults(result) {
            // 回测周期（个别引擎未返回时隐藏）
            const periodLabels = { '1d': '日线', '60m': '60分钟', '30m': '30分钟', '15m': '15分钟' };
            const periodEl = document.getElementById('period-info');
            if (result.start_date && result.end_date) {
                const label = periodLabels[document.getElementById('period-select').value] || '';
                periodEl.textContent =
                    `${label} · 回测区间：${result.start_date} ~ ${result.end_date} · ${result.total_days} 根K线`;
                periodEl.style.display = 'block';
            } else {
                periodEl.style.display = 'none';
            }

            const metrics = [
                { label: '初始资金', value: `¥${result.initial_cash.toLocaleString()}` },
                { label: '最终价值', value: `¥${result.final_value.toLocaleString()}` },
                { label: '总收益率', value: `${result.total_return}%`, className: result.total_return >= 0 ? 'positive' : 'negative' },
                { label: '年化收益', value: `${result.annual_return || 0}%`, className: (result.annual_return || 0) >= 0 ? 'positive' : 'negative' },
                { label: '夏普比率', value: result.sharpe_ratio || 0 },
                { label: '最大回撤', value: `${result.max_drawdown}%`, className: 'negative' },
                { label: '交易次数', value: result.total_trades || 0 },
                { label: '胜率', value: `${result.win_rate}%` },
            ];
            
            const container = document.getElementById('results-grid');
            container.innerHTML = metrics.map(m => `
                <div class="metric-card">
                    <div class="label">${m.label}</div>
                    <div class="value ${m.className || ''}">${m.value}</div>
                </div>
            `).join('');
            
            document.getElementById('results-section').classList.add('show');
        }
        
        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // ===== 走势量化分类 =====
        const STRAT_NAME_MAP = {
            'ma': '均线交叉', 'macd': 'MACD策略', 'boll': '布林带均值回归',
            'boll_macd': '布林+MACD', 'ma_macd': '均线+MACD共振',
            'rsi_boll': 'RSI+布林', 'macd_vol': 'MACD+放量',
            'kdj': 'KDJ金叉死叉', 'kdj_macd': 'KDJ+MACD共振',
        };

        async function classifyRegime() {
            const code = document.getElementById('stock-select').value;
            const period = document.getElementById('period-select').value;
            const group = document.getElementById('regime-group');
            const card = document.getElementById('regime-card');
            if (!code) { group.style.display = 'none'; return; }

            group.style.display = 'block';
            card.innerHTML = '<small style="color:#999">正在分析...</small>';
            try {
                const resp = await fetch(`/api/backtest/classify?pwd=${pwd}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, period })
                });
                const info = await resp.json();
                if (!resp.ok) throw new Error(info.detail || '分析失败');
                renderRegime(info);
            } catch (e) {
                card.innerHTML = `<small style="color:#c33">分类失败：${e.message}</small>`;
            }
        }

        function renderRegime(info) {
            const card = document.getElementById('regime-card');
            if (info.regime === 'unknown') {
                card.innerHTML = `<small style="color:#999">${info.note || info.reason}</small>`;
                return;
            }
            const chips = info.strategies.map(name => {
                const label = STRAT_NAME_MAP[name] || name;
                return `<button type="button" class="regime-chip" data-strategy="${name}">${label}</button>`;
            }).join('');
            card.innerHTML = `
                <span class="regime-badge ${info.regime}">${info.label}</span>
                <div class="regime-metrics">
                    <span>轨外运行比例 <b>${(info.outside_ratio * 100).toFixed(0)}%</b></span>
                    <span>带宽百分位 <b>${(info.bandwidth_pct * 100).toFixed(0)}%</b></span>
                    <span>布林带带宽 <b>${(info.bandwidth * 100).toFixed(1)}%</b></span>
                    <span>均线多头排列 <b>${info.bullish_align ? '是' : '否'}</b></span>
                    <span>偏离MA20 <b>${info.ma_dev_pct >= 0 ? '+' : ''}${info.ma_dev_pct}%</b></span>
                </div>
                <p class="regime-note">${info.note}</p>
                <div class="regime-chips">${chips}</div>
            `;
            // 点击推荐策略 chip -> 选中对应策略卡
            card.querySelectorAll('.regime-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const target = document.querySelector(`.strategy-card[data-name="${chip.dataset.strategy}"]`);
                    if (target) {
                        target.click();
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        showError('策略列表还没加载完，稍后再点');
                    }
                });
            });
        }
        
        // 初始化
        document.getElementById('run-backtest').addEventListener('click', runBacktest);
        document.getElementById('stock-select').addEventListener('change', classifyRegime);
        document.getElementById('period-select').addEventListener('change', classifyRegime);
        loadStrategies();
    </script>
</body>
</html>
