<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测 - 持仓工作台</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261108a">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        .backtest-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .backtest-header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .backtest-header h1 {
            font-size: 16px;
            margin: 0;
        }
        .backtest-header p { display: none; }
        
        .backtest-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .mp-wrap { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 13px; color: #475569; font-weight: 500; cursor: pointer; user-select: none; }
        .mp-wrap input { margin: 0; accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; }
        #multi-period-box .cat-pill {
            padding: 4px 14px;
            border-radius: 999px;
            border: 1.5px solid #e2e8f0;
            background: #fff;
            color: #475569;
            font-size: 12.5px;
            cursor: pointer;
            transition: border-color .15s, background .15s, color .15s;
        }
        #multi-period-box .cat-pill:hover { border-color: var(--accent); color: var(--accent); }
        #multi-period-box .cat-pill:active { transform: scale(0.97); }
        #multi-period-box .cat-pill.on {
            border-color: var(--accent);
            background: rgba(var(--accent-rgb, 102, 126, 234), 0.08);
            color: var(--accent);
            font-weight: 600;
        }
        .hist-item {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 6px 8px 6px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
            margin-bottom: 8px; font-size: 12.5px;
        }
        .hist-open {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0;
            border: none; background: none; padding: 4px 0; margin: -4px 0; cursor: pointer;
            text-align: left; font: inherit; border-radius: 8px;
        }
        .hist-open:hover .hist-desc { color: var(--accent); }
        .hist-open:focus-visible, .strategy-card:focus-visible, .cat-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .hist-item:hover { border-color: var(--accent); background: rgba(var(--accent-rgb, 102, 126, 234), 0.05); }
        .hist-time { color: #64748b; font-size: 11.5px; flex: none; }
        .hist-desc { color: #334155; flex: 1; min-width: 160px; }
        .hist-best { font-weight: 700; flex: none; }
        .hist-best.pos { color: var(--red); }
        .hist-best.neg { color: var(--green); }
        .hist-del { border: none; background: none; color: #64748b; cursor: pointer; font-size: 14px; min-width: 32px; min-height: 32px; padding: 4px 8px; flex: none; border-radius: 8px; }
        .hist-del:hover { color: var(--red); background: rgba(217, 45, 32, 0.08); }
        .hist-restored { background: rgba(var(--accent-rgb, 102, 126, 234), 0.08); border: 1px dashed var(--accent); color: var(--accent); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; margin: 0 0 14px; display: none; }
        .hist-load { border: 1px solid #e2e8f0; background: #fff; color: #475569; border-radius: 8px; padding: 6px 10px; min-height: 32px; font-size: 12px; cursor: pointer; }
        .hist-load:hover { border-color: var(--accent); color: var(--accent); }
        
        .strategy-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
        }
        .strat-cats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .strat-cats .sc-cat {
            padding: 4px 12px;
            border-radius: 999px;
            border: 1.5px solid #e2e8f0;
            background: #fff;
            color: #475569;
            font-size: 12.5px;
            cursor: pointer;
            transition: border-color .15s, background .15s, color .15s;
        }
        .strat-cats .sc-cat:hover { border-color: var(--accent); color: var(--accent); }
        .strat-cats .sc-cat:active { transform: scale(0.97); }
        .strat-cats .sc-cat:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .strat-cats .sc-cat.on {
            border-color: var(--accent);
            background: rgba(var(--accent-rgb, 102, 126, 234), 0.08);
            color: var(--accent);
            font-weight: 600;
        }
        .strat-cats .sc-cat small { font-size: 11px; color: #64748b; margin-left: 2px; }
        .strat-cats .sc-cat.on small { color: var(--accent); }
        .strategy-card.hidden-by-cat { display: none; }
        .strategy-card .sc-cat-tag {
            font-size: 10.5px;
            color: #64748b;
            background: #f1f5f9;
            border-radius: 4px;
            padding: 1px 6px;
            white-space: nowrap;
        }
        .strategy-card {
                position: relative;
                background: #fff;
                border: 1.5px solid #e2e2ee;
                border-radius: 10px;
                padding: 11px 13px;
                cursor: pointer;
                transition: border-color .2s, box-shadow .2s, background .2s;
            }
            .strategy-card:hover {
                border-color: var(--accent);
                box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
            }
            .strategy-card.selected {
                border-color: var(--accent);
                background: linear-gradient(135deg, rgba(102, 126, 234, 0.07), rgba(118, 75, 162, 0.07));
                box-shadow: 0 0 0 1px var(--accent) inset;
            }
            .strategy-card .sc-head {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 4px;
            }
            .strategy-card h3 {
                color: #1e293b;
                font-size: 13.5px;
                font-weight: 700;
                margin: 0;
                flex: 1;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .strategy-card.selected h3 { color: var(--accent); }
            .strategy-card p {
                color: #64748b;
                font-size: 12px;
                line-height: 1.5;
                margin: 0;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .strategy-card .sc-params {
                margin-top: 6px;
                font-size: 11px;
                color: #64748b;
                font-family: ui-monospace, Menlo, monospace;
            }
            .strategy-card .engine-badge {
                flex: none;
                background: rgba(102, 126, 234, 0.12);
                color: var(--accent);
                padding: 2px 8px;
                border-radius: 10px;
                font-size: 10.5px;
                font-weight: 600;
            }
            .strategy-card .engine-badge.vnpy { background: rgba(245, 158, 11, 0.13); color: #b45309; }
            .strategy-card .sc-check {
                position: absolute;
                top: -7px;
                right: -7px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: linear-gradient(135deg, var(--accent), var(--accent-2));
                color: #fff;
                font-size: 11px;
                line-height: 18px;
                text-align: center;
                display: none;
                box-shadow: 0 1px 4px rgba(102, 126, 234, 0.4);
            }
            .strategy-card.selected .sc-check { display: block; }
        .regime-card {
            background: #f8f7ff;
            border: 1px solid #e9e6ff;
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: #334155;
        }
        .regime-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }
        .regime-badge.ranging { background: linear-gradient(135deg, #3b82f6, #6366f1); }
        .regime-badge.trending { background: linear-gradient(135deg, #10b981, #0ea5e9); }
        .regime-badge.squeeze { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .regime-badge.neutral { background: #6b7280; }
        .regime-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
        }
        .regime-metrics span {
            background: #fff;
            border: 1px solid #e9e6ff;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
        }
        .regime-metrics b { color: var(--accent); }
        .regime-note { color: #64748b; margin: 6px 0 10px; line-height: 1.6; }
        .regime-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .regime-chip {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .regime-chip:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(var(--accent-rgb),0.4); }

        .run-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .run-button.run-all { margin-top: 10px; background: #fff; color: var(--accent); border: 1.5px solid var(--accent); font-size: 15px; padding: 12px; }
        .run-button.run-all:hover { background: rgba(var(--accent-rgb, 102, 126, 234), 0.08); }
        .run-button:hover {
            transform: scale(1.02);
        }
        
        .run-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            display: none;
        }
        
        .results-section.show {
            display: block;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .metric-card .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .metric-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .metric-card .value.positive {
            color: var(--red);
        }
        
        .metric-card .value.negative {
            color: var(--green);
        }

        /* 多策略对比表 */
        .cmp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 20px; }
        .cmp-table { border-collapse: collapse; width: 100%; min-width: 560px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .cmp-table th, .cmp-table td { padding: 10px 14px; font-size: 13.5px; text-align: right; border-bottom: 1px solid #f1f5f9; font-variant-numeric: tabular-nums; }
        .cmp-table th { background: #f8fafc; color: #64748b; font-weight: 600; text-align: right; white-space: nowrap; }
        .cmp-table th:first-child, .cmp-table td:first-child { text-align: left; color: #475569; position: sticky; left: 0; background: #fbfcfe; }
        .cmp-table td.best { font-weight: 700; }
        .cmp-table td.pos { color: var(--red); }
        .cmp-table td.neg { color: var(--green); }
        .cmp-table .eng-tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
        .cmp-table .eng-tag.backtrader { background: rgba(124, 58, 237, 0.1); color: #7c3aed; }
        .cmp-table .eng-tag.vnpy { background: rgba(245, 158, 11, 0.13); color: #b45309; }
        .cmp-table .eng-tag.zipline { background: rgba(14, 165, 233, 0.12); color: #0369a1; }
        .run-progress { font-size: 13px; color: #64748b; margin-top: 10px; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .error-message #error-text { flex: 1; min-width: 0; }
        #error-close {
            border: none; background: rgba(204, 51, 51, 0.1); color: #c33;
            width: 28px; height: 28px; border-radius: 6px; font-size: 14px;
            cursor: pointer; flex: none; line-height: 1;
        }
        #error-close:hover { background: rgba(204, 51, 51, 0.2); }

        /* 回测可视化：K线+买卖点 / 资金曲线 */
        .bt-chart-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
        .bt-chart-tabs:empty { display: none; }
        .bt-chart-tabs .bct-tab {
            border: 1px solid #e2e8f0; background: #fff; color: #475569;
            border-radius: 999px; padding: 4px 14px; font-size: 12.5px; cursor: pointer;
        }
        .bt-chart-tabs .bct-tab.on {
            border-color: var(--accent); color: var(--accent);
            background: rgba(var(--accent-rgb, 102, 126, 234), 0.08); font-weight: 600;
        }
        .bt-chart-wrap {
            background: #fff; border-radius: 12px; padding: 12px 8px 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 18px;
        }
        .bt-chart-box { width: 100%; height: 460px; }
        /* 多股票选择区 */
        .stock-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .stock-chips:empty::after { content: "尚未选择股票：上方搜索任意A股，或展开下方股票池点选"; color: #64748b; font-size: 12.5px; }
        .st-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: rgba(var(--accent-rgb, 102, 126, 234), 0.08); color: var(--accent); border-radius: 999px; padding: 4px 10px 4px 12px; font-size: 12.5px; font-weight: 600; }
        .st-chip .st-x { border: none; background: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
        .st-chip.custom { border-color: #f59e0b; background: rgba(245, 158, 11, 0.10); color: #b45309; }
        .st-btn.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .st-info { font-size: 12px; color: #64748b; white-space: nowrap; }
        .st-info.err { color: #d92d20; }
        /* 搜索框 + 下拉建议 */
        .st-search-wrap { position: relative; }
        .st-search-box { display: flex; align-items: center; gap: 8px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0 12px; background: #fff; transition: border-color .15s, box-shadow .15s; }
        .st-search-box svg { flex-shrink: 0; }
        .st-search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb, 102, 126, 234), 0.12); }
        .st-search-box input { flex: 1; min-width: 0; border: none; outline: none; padding: 10px 0; font-size: 13.5px; background: transparent; }
        .st-suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 60; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 8px 24px rgba(15, 23, 42, .12); max-height: 264px; overflow-y: auto; }
        .sg-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
        .sg-item.on, .sg-item:hover { background: rgba(var(--accent-rgb, 102, 126, 234), 0.07); }
        .sg-name { font-weight: 600; color: #1e293b; }
        .sg-code { color: #64748b; font-size: 12px; font-variant-numeric: tabular-nums; }
        .sg-tag { margin-left: auto; font-size: 11px; color: #64748b; border: 1px solid #e2e8f0; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
        .sg-tag.pool { color: var(--accent); border-color: var(--accent); background: rgba(var(--accent-rgb, 102, 126, 234), 0.07); }
        /* 股票池快捷点选 */
        .st-pool-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
        .st-pool-label { font-size: 12px; color: #64748b; }
        .st-pool-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
        .st-pool-grp { font-size: 11.5px; color: #64748b; background: #f1f5f9; border-radius: 6px; padding: 2px 8px; }
        .st-pick { border: 1px solid #e2e8f0; background: #fff; color: #475569; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; transition: all .12s; }
        .st-pick:hover { border-color: var(--accent); color: var(--accent); }
        .st-pick.picked { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
        @media (max-width: 480px) { .st-pool-chips { max-height: 168px; overflow-y: auto; } }
        /* 交叉对比矩阵 */
        .mtx-wrap { overflow-x: auto; margin-bottom: 18px; }
        .mtx-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
        .mtx-table th, .mtx-table td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: center; }
        .mtx-table th { background: #f8fafc; color: #475569; }
        .mtx-table th.sortable { cursor: pointer; user-select: none; }
        .mtx-table th.sortable:hover { background: #eef2ff; color: var(--accent); }
        .mtx-table th.on { background: rgba(var(--accent-rgb, 102, 126, 234), 0.12); color: var(--accent); font-weight: 700; }
        .mtx-table td.rowh { text-align: left; font-weight: 600; color: #334155; white-space: nowrap; }
        .mtx-table td.pos { color: var(--red); }
        .mtx-table td.neg { color: var(--green); }
        .mtx-table td.best { background: rgba(var(--accent-rgb, 102, 126, 234), 0.10); font-weight: 700; }
        .cmp-stock-title { font-weight: 700; font-size: 14px; color: #334155; margin: 18px 0 8px; }
        /* 策略参数变体 */
        .mini-link-btn { border: none; background: none; font-size: 12px; cursor: pointer; padding: 6px 8px; min-height: 32px; }
        .strategy-card .sc-gear { border: none; background: none; color: var(--accent); font-size: 11.5px; cursor: pointer; padding: 6px 8px; margin: -6px 0 -6px 4px; min-height: 32px; }
        .sc-editor { margin-top: 8px; padding: 8px; background: #f8fafc; border-radius: 8px; }
        .sc-editor .se-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: #475569; }
        .sc-editor .se-row label { flex: 1; }
        .sc-editor .se-row input { width: 74px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px 6px; font-size: 12px; }
        .sc-editor .se-name { width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; padding: 4px 6px; font-size: 12px; margin-bottom: 6px; }
        .sc-editor .se-btns { display: flex; gap: 6px; }
        .sc-editor .sev-btn { border: 1px solid var(--accent); background: rgba(var(--accent-rgb, 102, 126, 234), 0.08); color: var(--accent); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
        .sev-btn.ghost { border-color: #e2e8f0; background: #fff; color: #64748b; }
        .strategy-card.is-variant { border-style: dashed; }
        .strategy-card.is-variant .sc-cat-tag { background: rgba(245, 158, 11, 0.13); color: #b45309; }
        .sc-del-var { border: none; background: none; color: #d92d20; font-size: 11.5px; cursor: pointer; padding: 0; margin-left: 8px; }
        @media (max-width: 480px) { .bt-chart-box { height: 380px; } }
    </style>
    <script src="/static/echarts.min.js"></script>
</head>
<body>
    <div class="backtest-container">
        <div class="backtest-header">
            <h1><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v6L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8V2 M8.5 2h7 M7 15h10"/></svg> 量化回测实验室</h1>
            <p>使用历史数据验证交易策略</p>
        </div>

        <nav class="mobile-quicknav" aria-label="页面快捷导航">
            <a href="/?pwd={{ pwd }}">持仓</a>
            <a href="/quant?pwd={{ pwd }}">信号中心</a>
            <a href="/backtest?pwd={{ pwd }}" class="on">回测</a>
            <a href="/lab?pwd={{ pwd }}">实验室</a>
            <a href="/research?pwd={{ pwd }}">研究中心</a>
        </nav>
        
        <!-- 回测表单 -->
        <div class="backtest-form">
            <div class="form-group">
                <label>回测股票 <small style="color:#64748b; font-weight:400;">（可多只，与策略交叉对比）
                    <button type="button" id="st-clear" class="mini-link-btn" style="color:#64748b;">清空</button>
                </small></label>
                <div class="stock-chips" id="stock-chips" aria-label="已选股票"></div>
                <div class="st-search-wrap">
                    <div class="st-search-box">
                        <svg class="ic" style="width:15px;height:15px;color:#64748b" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input type="text" id="st-search" autocomplete="off" placeholder="搜索股票：名称 / 6位代码 / 拼音首字母（如 gzmt），回车添加" aria-label="搜索股票" aria-expanded="false" role="combobox">
                        <span class="st-info" id="st-info"></span>
                    </div>
                    <div class="st-suggest" id="st-suggest" role="listbox" style="display:none"></div>
                </div>
                <div class="st-pool-row">
                    <span class="st-pool-label">快捷加入</span>
                    <button type="button" class="st-btn ghost" id="st-toggle-pool" class="mini-link-btn" style="color:var(--accent);">展开股票池</button>
                </div>
                <div id="st-pool-detail" style="display:none">
                    <div class="st-pool-chips" id="st-quick-held"></div>
                    <div class="st-pool-chips" id="st-quick-pool"></div>
                </div>
                <script id="pool-data" type="application/json">{{ pool_json | safe }}</script>
            </div>
            
            <div class="form-group">
                <label>K线周期</label>
                <select id="period-select" aria-label="回测周期">
                    <option value="1d">日线（约 1.5 年历史）</option>
                    <option value="60m">60 分钟（约 1 年）</option>
                    <option value="30m">30 分钟（约半年）</option>
                    <option value="15m">15 分钟（约 3 个月）</option>
                </select>
                <label class="mp-wrap" title="同一批股票×策略，在多个周期上各跑一遍，结果并排对比">
                    <input type="checkbox" id="multi-period"> 多周期模式（勾选后下方选择 2-4 个周期）
                </label>
                <div id="multi-period-box" style="display:none; margin-top:8px; gap:6px; flex-wrap:wrap;"></div>
            </div>

            <div class="form-group" id="regime-group" style="display: none;">
                <label>走势分类（量化自动判断）</label>
                <div id="regime-card" class="regime-card"></div>
            </div>

            <div class="form-group">
                <label>选择策略 <small style="color:#64748b; font-weight:400;">（可多选，同时回测对比）
                    <button type="button" id="pick-all" class="mini-link-btn" style="color:var(--accent);">全选</button>/<button type="button" id="pick-none" class="mini-link-btn" style="color:#64748b;">清空</button>
                </small></label>
                <div class="strat-cats" id="strat-cats" role="group" aria-label="策略分类筛选"></div>
                <div class="strategy-cards" id="strategy-cards">
                    <!-- 动态加载 -->
                </div>
                <small id="strategy-picked" style="color:#64748b;"></small>
            </div>
            
            <div class="form-group">
                <label for="initial-cash">初始资金 (¥)</label>
                <input type="number" id="initial-cash" value="100000" min="10000" step="10000">
            </div>

            <div class="form-group">
                <label for="commission">手续费率（单边）</label>
                <input type="number" id="commission" value="0.001" min="0" max="0.01" step="0.0001">
                <small style="color: #999; font-size: 12px;">默认 0.001（千一）；万一填 0.0001</small>
            </div>
            
            <button class="run-button" id="run-backtest" type="button">开始回测</button>
            <button class="run-button run-all" id="run-all" type="button" title="持仓+股票池全部股票 × 全部策略（含自定义变体）一键交叉回测"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg> 全量回测（所有股票 × 所有策略）</button>
        </div>

        <!-- 回测历史（自动保留最近 10 次摘要，本机存储） -->
        <div class="form-group" id="history-group" style="display:none;">
            <label><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h12a2 2 0 0 0 2-2v-2H8a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h13a2 2 0 0 1 2 2v12"/><path d="M8 21a2 2 0 0 1-2-2V7"/></svg> 历史回测 <small style="color:#64748b; font-weight:400;">（保留最近 10 次的摘要，点击可查看对比矩阵；曲线图不保留）
                <button type="button" id="hist-clear" class="mini-link-btn" style="color:var(--red);">清空</button>
            </small></label>
            <div id="history-list"></div>
        </div>
        
        <!-- 加载状态 -->
        <div class="loading" id="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p id="loading-text">正在运行回测，请稍候...</p>
        </div>
        
        <!-- 错误信息 -->
        <div class="error-message" id="error-message" role="alert" aria-live="assertive" style="display: none;"><span id="error-text"></span><button type="button" id="error-close" aria-label="关闭提示" title="关闭">✕</button></div>
        
        <!-- 回测结果 -->
        <div class="results-section" id="results-section">
            <h2 style="margin-bottom: 12px;">回测结果</h2>
            <p id="period-info" style="color: #64748b; font-size: 14px; margin: 0 0 20px;"></p>
            <div class="hist-restored" id="hist-restored"></div>
            <div class="bt-chart-tabs" id="bt-chart-tabs"></div>
            <div class="bt-chart-wrap" id="bt-chart-wrap" style="display: none;">
                <div class="bt-chart-box" id="bt-chart-box"></div>
            </div>
            <div id="compare-wrap"></div>
            <div class="results-grid" id="results-grid">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>
    
    <script>
        const pwd = "{{ pwd }}";
        // 多选：Map<cardName, {name, display, engine}>，保持勾选顺序
        const picked = new Map();

        // ===== 多股票选择 =====
        const ST_KEY = 'jungl…s-v1';
        let selStocks = [];   // [{code, name, custom?}]，保持加入顺序
        try { selStocks = JSON.parse(localStorage.getItem(ST_KEY) || '[]'); if (!Array.isArray(selStocks)) selStocks = []; } catch (e) { selStocks = []; }

        function saveSelStocks() {
            try { localStorage.setItem(ST_KEY, JSON.stringify(selStocks)); } catch (e) {}
        }

        function renderStockChips() {
            const el = document.getElementById('stock-chips');
            el.innerHTML = selStocks.map((s, i) =>
                `<span class="st-chip${s.custom ? ' custom' : ''}" title="${s.code}">${s.name}<small style="font-weight:400;opacity:.75">${s.code}</small><button type="button" class="st-x" data-i="${i}" aria-label="移除 ${s.name}">×</button></span>`
            ).join('');
            el.querySelectorAll('.st-x').forEach(btn => {
                btn.addEventListener('click', () => { selStocks.splice(Number(btn.dataset.i), 1); saveSelStocks(); renderStockChips(); if (typeof classifyRegime === 'function') classifyRegime(); });
            });
        }
        function addStock(code, name, custom = false) {
            if (selStocks.some(s => s.code === code)) { selStocks = selStocks.filter(s => s.code !== code); }  // 重复加入=置顶
            selStocks.push({ code, name, custom });
            saveSelStocks(); renderStockChips();
            if (typeof syncPoolChips === 'function') syncPoolChips();
            if (typeof classifyRegime === 'function') classifyRegime();
        }

        // ===== 股票数据源：持仓 + 量化池（服务端注入）=====
        const POOL = (() => { try { return JSON.parse(document.getElementById('pool-data').textContent); } catch (e) { return { held: [], pool: [] }; } })();
        const POOL_MAP = {};   // code -> {code,name,group}
        POOL.held.forEach(s => POOL_MAP[s.code] = { ...s, group: '持仓' });
        POOL.pool.forEach(s => { if (!POOL_MAP[s.code]) POOL_MAP[s.code] = { ...s, group: '股票池' }; });

        // ===== 搜索框：名称/代码/拼音，下拉建议，回车添加 =====
        const stSearch = document.getElementById('st-search');
        const stSuggest = document.getElementById('st-suggest');
        const stInfo = document.getElementById('st-info');
        let sgItems = [], sgIdx = -1, sgTimer = null, sgReq = 0;

        function closeSuggest() { stSuggest.style.display = 'none'; sgItems = []; sgIdx = -1; stSearch.setAttribute('aria-expanded', 'false'); }
        function renderSuggest() {
            if (!sgItems.length) { closeSuggest(); return; }
            stSuggest.innerHTML = sgItems.map((s, i) => {
                const inPool = POOL_MAP[s.code];
                const added = selStocks.some(x => x.code === s.code);
                return `<div class="sg-item${i === sgIdx ? ' on' : ''}" data-i="${i}" role="option">
                    <span class="sg-name">${s.name}</span><span class="sg-code">${s.code}</span>
                    <span class="sg-tag${inPool ? ' pool' : ''}">${inPool ? inPool.group : (added ? '已加入' : '池外')}</span></div>`;
            }).join('');
            stSuggest.style.display = 'block';
            stSearch.setAttribute('aria-expanded', 'true');
            stSuggest.querySelectorAll('.sg-item').forEach(el => {
                el.addEventListener('mousedown', e => { e.preventDefault(); chooseSuggest(sgItems[Number(el.dataset.i)]); });
            });
        }
        function chooseSuggest(s) {
            if (!s) return;
            clearTimeout(sgTimer); sgReq++;   // 取消挂起的搜索，防止下拉重弹
            const pool = POOL_MAP[s.code];
            addStock(s.code, s.name, !pool);
            stSearch.value = ''; closeSuggest(); stInfo.className = 'st-info'; stInfo.textContent = '';
        }
        async function doSearch(q) {
            const seq = ++sgReq;
            try {
                const resp = await fetch(`/api/backtest/search?pwd=${pwd}&q=${encodeURIComponent(q)}`);
                const data = await resp.json();
                if (seq !== sgReq) return;   // 丢弃过期响应
                sgItems = data.results || [];
                sgIdx = sgItems.length ? 0 : -1;
                renderSuggest();
                if (!sgItems.length) { stInfo.className = 'st-info err'; stInfo.textContent = '无匹配'; }
            } catch (e) { if (seq === sgReq) { stInfo.className = 'st-info err'; stInfo.textContent = '搜索失败'; } }
        }
        async function lookupByCode(code) {
            stInfo.className = 'st-info'; stInfo.textContent = '查询中…';
            try {
                const resp = await fetch(`/api/backtest/lookup?pwd=${pwd}&code=${code}`);
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || '查询失败');
                chooseSuggest({ code: data.code, name: data.name });
                stInfo.textContent = '';
            } catch (e) {
                stInfo.className = 'st-info err'; stInfo.textContent = e.message;
            }
        }
        stSearch.addEventListener('input', () => {
            clearTimeout(sgTimer);
            stInfo.textContent = '';
            const q = stSearch.value.trim();
            if (!q) { closeSuggest(); return; }
            sgTimer = setTimeout(() => doSearch(q), 250);
        });
        stSearch.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                if (!sgItems.length) return;
                e.preventDefault();
                sgIdx = (sgIdx + (e.key === 'ArrowDown' ? 1 : -1) + sgItems.length) % sgItems.length;
                renderSuggest();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (sgIdx >= 0 && sgItems[sgIdx]) { chooseSuggest(sgItems[sgIdx]); return; }
                const q = stSearch.value.trim().replace(/^(sh|sz|bj)/i, '');
                if (/^\d{6}$/.test(q)) lookupByCode(q);
            } else if (e.key === 'Escape') {
                closeSuggest();
            }
        });
        stSearch.addEventListener('blur', () => setTimeout(closeSuggest, 150));

        // ===== 股票池快捷点选（默认折叠）=====
        (function initPoolChips() {
            const grpLabel = t => `<span class="st-pool-grp">${t}</span>`;
            const chip = s => `<button type="button" class="st-pick${selStocks.some(x => x.code === s.code) ? ' picked' : ''}" data-code="${s.code}" data-name="${s.name}" data-custom="${POOL_MAP[s.code] ? '' : '1'}" title="${s.code}">${s.name}</button>`;
            document.getElementById('st-quick-held').innerHTML = grpLabel('持仓') + POOL.held.map(chip).join('');
            document.getElementById('st-quick-pool').innerHTML = grpLabel('量化股票池') + POOL.pool.map(chip).join('');
            document.getElementById('st-pool-detail').addEventListener('click', e => {
                const btn = e.target.closest('.st-pick');
                if (!btn) return;
                addStock(btn.dataset.code, btn.dataset.name, !!btn.dataset.custom);
                syncPoolChips();
            });
            const detail = document.getElementById('st-pool-detail'), toggle = document.getElementById('st-toggle-pool');
            toggle.addEventListener('click', () => {
                const open = detail.style.display !== 'none';
                detail.style.display = open ? 'none' : 'block';
                toggle.textContent = open ? '展开股票池' : '收起';
            });
        })();
        function syncPoolChips() {
            document.querySelectorAll('#st-pool-detail .st-pick').forEach(btn =>
                btn.classList.toggle('picked', selStocks.some(x => x.code === btn.dataset.code)));
        }

        document.getElementById('st-clear').addEventListener('click', () => { selStocks = []; saveSelStocks(); renderStockChips(); syncPoolChips(); });
        renderStockChips();

        function updatePickedLabel() {
            const pk = document.getElementById('strategy-picked');
            pk.textContent = picked.size
                ? `已选 ${picked.size} 个：` + [...picked.values()].map(v => v.display).join('、')
                : '';
        }

        // ===== 策略参数变体（自定义策略）=====
        const VAR_KEY = 'jungl…s-v1';
        const stratMeta = {};              // name -> {params, display}，loadStrategies 时填充
        const variants = new Map();        // vkey -> {base, display, params, category}
        try { (JSON.parse(localStorage.getItem(VAR_KEY) || '[]')).forEach(v => variants.set(variantKey(v.base, v.params), v)); } catch (e) {}

        function variantKey(base, params) {
            return base + '|' + Object.keys(params).sort().map(k => `${k}=${params[k]}`).join(',');
        }
        function saveVariants() {
            try { localStorage.setItem(VAR_KEY, JSON.stringify([...variants.values()])); } catch (e) {}
        }

        function buildParamEditor(name) {
            const meta = stratMeta[name];
            const ed = document.getElementById(`ed-${name}`);
            if (!meta || !ed) return;
            ed.innerHTML =
                Object.entries(meta.params).map(([k, v]) =>
                    `<div class="se-row"><label for="edp-${name}-${k}">${k}</label><input type="number" step="any" value="${v}" data-p="${k}" id="edp-${name}-${k}"></div>`
                ).join('') +
                `<input class="se-name" placeholder="变体名称（如：布林带(10,1.5)）" id="edn-${name}" aria-label="策略变体名称">` +
                `<div class="se-btns"><button type="button" class="sev-btn" data-save="${name}">存为变体并选中</button>` +
                `<button type="button" class="sev-btn ghost" data-close="${name}">收起</button></div>`;
            ed.querySelector('[data-close]').addEventListener('click', (e) => { e.stopPropagation(); ed.style.display = 'none'; });
            ed.querySelector('[data-save]').addEventListener('click', (e) => {
                e.stopPropagation();
                const params = {};
                let bad = false;
                ed.querySelectorAll('input[data-p]').forEach(inp => {
                    const num = Number(inp.value);
                    if (!Number.isFinite(num) || num <= 0) { bad = true; inp.style.borderColor = '#d92d20'; }
                    params[inp.dataset.p] = Number.isInteger(num) ? num : num;
                });
                if (bad) { showError('参数需为正数'); return; }
                const vkey = variantKey(name, params);
                const pstr = Object.values(params).map(v => (Number.isInteger(v) ? v : Math.round(v * 100) / 100)).join(',');
                const display = (document.getElementById(`edn-${name}`).value.trim()) || `${meta.display}(${pstr})`;
                if (!variants.has(vkey)) {
                    variants.set(vkey, { base: name, display, params, category: '自定义' });
                    saveVariants();
                }
                ed.style.display = 'none';
                addVariantCard(variants.get(vkey), true);
            });
        }

        function addVariantCard(v, select = false) {
            const container = document.getElementById('strategy-cards');
            if (!container) return;
            const existing = container.querySelector(`.strategy-card[data-vkey="${v.vkey || ''}"]`);
            if (existing) { if (select) toggleCard(existing, true); return; }
            const vkey = variantKey(v.base, v.params);
            const card = document.createElement('div');
            card.className = 'strategy-card is-variant';
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-pressed', 'false');
            card.dataset.name = v.base;
            card.dataset.vkey = vkey;
            card.dataset.engine = 'backtrader';
            card.dataset.category = '自定义';
            const fmt = Object.entries(v.params).map(([k, val]) => `${k}=${val}`).join(' ');
            card.innerHTML = `<span class="sc-check">✓</span>
                <div class="sc-head"><h3>${v.display}</h3><button type="button" class="sc-del-var" data-del="${vkey}">删除</button></div>
                <div style="margin-bottom:4px;"><span class="sc-cat-tag">自定义</span><small style="color:#64748b;font-size:11px;margin-left:6px;">基于 ${stratMeta[v.base]?.display || v.base}</small></div>
                <p>自定义参数变体</p><div class="sc-params">${fmt}</div>`;
            card.addEventListener('click', (e) => { if (!e.target.dataset.del) toggleCard(card); });
            card.querySelector('[data-del]').addEventListener('click', (e) => {
                e.stopPropagation();
                variants.delete(vkey); saveVariants();
                if (picked.has(vkey)) { picked.delete(vkey); updatePickedLabel(); }
                card.remove();
            });
            container.appendChild(card);
            updateCatCounts();
            if (select) toggleCard(card, true);
        }

        function renderVariantCards() {
            variants.forEach(v => addVariantCard({ vkey: variantKey(v.base, v.params), ...v }, false));
        }

        function toggleCard(card, forceOn = null) {
            const name = card.dataset.name;
            const vkey = card.dataset.vkey || '';           // 变体卡用 vkey 区分
            const on = forceOn !== null ? forceOn : !picked.has(vkey || name);
            if (on) {
                picked.set(vkey || name, {
                    name, variant: vkey, key: vkey,
                    display: card.querySelector('h3').textContent,
                    engine: card.dataset.engine,
                    params: vkey ? (variants.get(vkey) || {}).params : null,
                });
                card.classList.add('selected');
                card.setAttribute('aria-pressed', 'true');
            } else {
                picked.delete(vkey || name);
                card.classList.remove('selected');
                card.setAttribute('aria-pressed', 'false');
            }
            updatePickedLabel();
        }
        // 键盘可达：Enter/Space 切换选中（div[role=button] 原生不响应按键）
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest ? e.target.closest('.strategy-card') : null;
            if (!card || e.target !== card) return;   // 焦点在卡内部按钮时不拦截
            e.preventDefault();
            toggleCard(card);
        });
        
        // 加载策略列表
        async function loadStrategies() {
            try {
                const response = await fetch(`/api/backtest/strategies?pwd=${pwd}`);
                const strategies = await response.json();
                
                const container = document.getElementById('strategy-cards');
                const fmtParams = p => Object.entries(p || {}).map(([k, v]) => `${k}=${v}`).join(' ');
                Object.keys(stratMeta).forEach(k => delete stratMeta[k]);
                strategies.forEach(s => { stratMeta[s.name] = { params: s.params || {}, display: s.display_name }; });
                container.innerHTML = strategies.map(s => {
                    const vnpy = s.name.startsWith('vnpy');
                    const cat = s.category || '其他';
                    const gear = (!vnpy && s.name !== 'zipline' && Object.keys(s.params || {}).length)
                        ? `<button type="button" class="sc-gear" data-gear="${s.name}" title="修改参数并存为变体"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 改参数</button>` : '';
                    return `
                    <div class="strategy-card" tabindex="0" role="button" aria-pressed="false" data-name="${s.name}" data-engine="${vnpy ? 'vnpy' : 'backtrader'}" data-category="${cat}">
                        <span class="sc-check">✓</span>
                        <div class="sc-head">
                            <h3>${s.display_name}</h3>
                            <span class="engine-badge ${vnpy ? 'vnpy' : ''}">${vnpy ? 'vnpy' : 'Backtrader'}</span>
                        </div>
                        <div style="margin-bottom:4px;"><span class="sc-cat-tag">${cat}</span>${gear}</div>
                        <p>${s.description}</p>
                        <div class="sc-params">${fmtParams(s.params)}</div>
                        <div class="sc-editor" id="ed-${s.name}" style="display:none;"></div>
                    </div>`;
                }).join('');

                // 齿轮按钮: 改参数：展开编辑器（点击卡片本身仍是勾选，不冲突）
                container.querySelectorAll('.sc-gear').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const name = btn.dataset.gear;
                        const ed = document.getElementById(`ed-${name}`);
                        const open = ed.style.display !== 'none';
                        container.querySelectorAll('.sc-editor').forEach(x => { x.style.display = 'none'; });
                        if (!open) { buildParamEditor(name); ed.style.display = 'block'; }
                    });
                });

                // 分类筛选 pill（按出现顺序聚合，带计数）
                const cats = new Map();
                strategies.forEach(s => {
                    const c = s.category || '其他';
                    cats.set(c, (cats.get(c) || 0) + 1);
                });
                const catsEl = document.getElementById('strat-cats');
                catsEl.innerHTML = `<button type="button" class="sc-cat all on" data-cat="all" aria-pressed="true">全部<small>${strategies.length}</small></button>` +
                    [...cats.entries()].map(([c, n]) =>
                        `<button type="button" class="sc-cat" data-cat="${c}" aria-pressed="false">${c}<small>${n}</small></button>`
                    ).join('');
                catsEl.querySelectorAll('.sc-cat').forEach(btn => {
                    btn.addEventListener('click', () => applyCatFilter(btn.dataset.cat));
                });
                
                // 点击=多选切换（再次点击取消）
                document.querySelectorAll('.strategy-card').forEach(card => {
                    card.addEventListener('click', () => toggleCard(card));
                });
                renderVariantCards();   // 恢复已保存的自定义变体卡
                document.getElementById('pick-all').addEventListener('click', () => {
                    document.querySelectorAll('.strategy-card:not(.hidden-by-cat)').forEach(c => toggleCard(c, true));
                });
                document.getElementById('pick-none').addEventListener('click', () => {
                    picked.clear();
                    document.querySelectorAll('.strategy-card').forEach(c => { c.classList.remove('selected'); c.setAttribute('aria-pressed', 'false'); });
                    updatePickedLabel();
                });
            } catch (error) {
                console.error('加载策略失败:', error);
            }
        }

        function applyCatFilter(cat) {
            const catsEl = document.getElementById('strat-cats');
            if (!catsEl) return;
            catsEl.querySelectorAll('.sc-cat').forEach(b => {
                const on = b.dataset.cat === cat;
                b.classList.toggle('on', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            document.querySelectorAll('.strategy-card').forEach(card => {
                card.classList.toggle('hidden-by-cat', cat !== 'all' && card.dataset.category !== cat);
            });
        }

        // 变体增删后重算分类 pill 计数（保持当前选中分类）
        function updateCatCounts() {
            const catsEl = document.getElementById('strat-cats');
            if (!catsEl) return;
            const active = catsEl.querySelector('.sc-cat.on');
            const cur = active ? active.dataset.cat : 'all';
            const counts = new Map();
            document.querySelectorAll('.strategy-card').forEach(c => {
                const cat = c.dataset.category || '其他';
                counts.set(cat, (counts.get(cat) || 0) + 1);
            });
            const total = [...counts.values()].reduce((a, b) => a + b, 0);
            catsEl.innerHTML = `<button type="button" class="sc-cat all${cur === 'all' ? ' on' : ''}" data-cat="all" aria-pressed="${cur === 'all'}">全部<small>${total}</small></button>` +
                [...counts.entries()].map(([c, n]) =>
                    `<button type="button" class="sc-cat${c === cur ? ' on' : ''}" data-cat="${c}" aria-pressed="${c === cur}">${c}<small>${n}</small></button>`
                ).join('');
            catsEl.querySelectorAll('.sc-cat').forEach(btn => {
                btn.addEventListener('click', () => applyCatFilter(btn.dataset.cat));
            });
        }
        
        // 运行回测：勾选的每个策略串行执行，最后统一渲染对比
        function scrollToEl(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const y = el.getBoundingClientRect().top + window.scrollY - 70;  // 避开 sticky quicknav
            window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
        }

        // 收集全部候选股票（持仓 + 股票池 + 已查询添加的池外股）
        function allStocksFromSelect() {
            const out = POOL.held.concat(POOL.pool);
            selStocks.forEach(s => { if (!out.some(o => o.code === s.code)) out.push({ code: s.code, name: s.name }); });
            return out.filter((s, i) => out.findIndex(o => o.code === s.code) === i);
        }
        // 收集全部策略卡（含自定义变体，无视分类筛选与勾选状态）
        function allStrategyItems() {
            const items = [];
            document.querySelectorAll('.strategy-card').forEach(card => {
                const vkey = card.dataset.vkey || '';
                items.push({
                    name: card.dataset.name, variant: vkey, key: vkey || card.dataset.name,
                    display: card.querySelector('h3').textContent,
                    engine: card.dataset.engine,
                    params: vkey ? (variants.get(vkey) || {}).params : null,
                });
            });
            return items;
        }

        // ===== 多周期模式 =====
        const PERIOD_LABELS = { '1d': '日线', '60m': '60分钟', '30m': '30分钟', '15m': '15分钟' };
        const mpSel = new Set(['1d', '30m']);   // 默认：日线 + 30分钟
        (function initMpBox() {
            const box = document.getElementById('multi-period-box');
            box.innerHTML = Object.entries(PERIOD_LABELS).map(([k, v]) =>
                `<button type="button" class="cat-pill${mpSel.has(k) ? ' on' : ''}" data-p="${k}" onclick="mpToggle(this)">${v}</button>`).join('');
        })();
        function mpToggle(btn) {
            const k = btn.dataset.p;
            if (mpSel.has(k)) { if (mpSel.size > 1) mpSel.delete(k); } else { if (mpSel.size >= 4) { showError('最多同时对比 4 个周期'); return; } mpSel.add(k); }
            document.querySelectorAll('#multi-period-box .cat-pill').forEach(el => el.classList.toggle('on', mpSel.has(el.dataset.p)));
        }
        function mpPeriods() { return ['1d', '60m', '30m', '15m'].filter(k => mpSel.has(k)); }
        document.getElementById('multi-period').addEventListener('change', e => {
            const box = document.getElementById('multi-period-box');
            box.style.display = e.target.checked ? 'flex' : 'none';
        });

        // ===== 回测历史（localStorage 保留最近 10 次摘要） =====
        const HIST_KEY='jungle…y-v1';
        const HIST_MAX = 10;
        function histLight(res) {
            if (!res || !res.success) return { success: false, error: (res && res.error) || '失败' };
            const { total_return, annual_return, sharpe_ratio, max_drawdown, total_trades, win_rate, initial_cash, final_value, start_date, end_date, total_days } = res;
            return { success: true, total_return, annual_return, sharpe_ratio, max_drawdown, total_trades, win_rate, initial_cash, final_value, start_date, end_date, total_days };
        }
        function histStore(arr) {
            // 配额兜底：写不进就砍最旧的再试
            const trySet = n => { try { localStorage.setItem(HIST_KEY, JSON.stringify(arr.slice(0, n))); return true; } catch (e) { return false; } };
            for (const n of [arr.length, 5, 3, 1]) { if (trySet(n)) { arr.length = Math.min(arr.length, n); return; } }
            try { localStorage.removeItem(HIST_KEY); } catch (e) {}
        }
        function saveHistory(results, periods) {
            const ok = results.filter(r => r.result.success);
            if (!ok.length) return;
            const best = ok.reduce((a, b) => Number(b.result.total_return) > Number(a.result.total_return) ? b : a);
            const stocks = new Set(results.map(r => r.st.code)).size;
            const strats = new Set(results.map(r => `${r.name}|${r.variant || ''}`)).size;
            const entry = {
                t: Date.now(), stocks, strats, periods: Array.isArray(periods) ? periods.slice() : [periods || '1d'],
                best: { label: `${best.st.name}·${best.display}${(Array.isArray(periods) ? periods.length : 1) > 1 ? '·' + (PERIOD_LABELS[best.p] || '') : ''}`, ret: Number(best.result.total_return) },
                combos: results.map(r => ({ name: r.name, display: r.display, engine: r.engine, variant: r.variant || '', algo: r.algo || '', params: r.params || null, st: { code: r.st.code, name: r.st.name }, p: r.p || '1d', result: histLight(r.result) })),
            };
            let arr = []; try { arr = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); if (!Array.isArray(arr)) arr = []; } catch (e) { arr = []; }
            arr.unshift(entry); arr.length = Math.min(arr.length, HIST_MAX);
            histStore(arr);
            renderHistoryList();
        }
        function loadHist() { let a = []; try { a = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) {} return Array.isArray(a) ? a : []; }
        function renderHistoryList() {
            const arr = loadHist();
            const group = document.getElementById('history-group');
            const list = document.getElementById('history-list');
            if (!arr.length) { group.style.display = 'none'; list.innerHTML = ''; return; }
            group.style.display = 'block';
            list.innerHTML = arr.map((h, i) => {
                const d = new Date(h.t);
                const pad = n => String(n).padStart(2, '0');
                const time = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
                const pArr = h.periods || ['1d'];
                const pdTxt = pArr.length > 1 ? `多周期(${pArr.length})` : (PERIOD_LABELS[pArr[0]] || pArr[0]);
                const pos = Number(h.best.ret) >= 0;
                return `<div class="hist-item">
                    <button type="button" class="hist-open" onclick="restoreHistory(${i})" title="点击查看该次结果（矩阵/KPI 可还原，曲线图不保留）">
                        <span class="hist-time">${time}</span>
                        <span class="hist-desc">${h.stocks}股 × ${h.strats}策 × ${pdTxt} = ${h.combos.length}组合 · ${h.best.label} <b class="hist-best ${pos ? 'pos' : 'neg'}">${pos ? '+' : ''}${h.best.ret}%</b></span>
                    </button>
                    <button type="button" class="hist-load" onclick="rerunHistory(${i})" title="按这组的股票×策略×周期重新跑（拿最新数据和曲线）">重跑</button>
                    <button type="button" class="hist-del" onclick="delHistory(${i})" title="删除" aria-label="删除这条历史">✕</button>
                </div>`;
            }).join('');
        }
        function delHistory(i) { const arr = loadHist(); arr.splice(i, 1); histStore(arr); renderHistoryList(); }
        document.getElementById('hist-clear').addEventListener('click', () => {
            if (!confirm('确定清空全部回测历史？')) return;
            try { localStorage.removeItem(HIST_KEY); } catch (e) {}
            renderHistoryList();
        });
        function restoreHistory(i) {
            const h = loadHist()[i];
            if (!h) return;
            const results = h.combos.map(c => ({ name: c.name, display: c.display, engine: c.engine, variant: c.variant, st: c.st, p: c.p, result: c.result, key: `${c.st.code}|${c.p}|${c.name}|${c.variant || ''}` }));
            const d = new Date(h.t);
            const note = document.getElementById('hist-restored');
            note.textContent = `正在查看 ${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 的历史回测（保留矩阵与指标摘要；曲线图较重未保留，点「重跑」可获取最新完整结果）`;
            note.style.display = 'block';
            displayResults(results, h.periods || ['1d']);
            scrollToEl('results-section');
        }
        // 重跑：从历史组合提取股票/策略/周期，走与正常回测相同的执行链
        function rerunHistory(i) {
            const h = loadHist()[i];
            if (!h) return;
            const stocks = [];
            h.combos.forEach(c => { if (!stocks.some(s => s.code === c.st.code)) stocks.push({ code: c.st.code, name: c.st.name }); });
            const items = [];
            h.combos.forEach(c => { const k = `${c.name}|${c.variant}`; if (!items.some(x => `${x.name}|${x.variant || ''}` === k)) items.push({ name: c.name, display: c.display, engine: c.engine, variant: c.variant || undefined, key: c.variant || c.name, params: c.params || null }); });
            document.getElementById('hist-restored').style.display = 'none';
            return runJobs(stocks, items, h.periods || undefined);
        }
        renderHistoryList();

        // 实际执行：stocks × items（× 周期）交叉串行回测 + 渲染
        async function runJobs(stocks, items, forcePeriods) {
            const multi = document.getElementById('multi-period').checked;
            let periods = [document.getElementById('period-select').value];
            if (Array.isArray(forcePeriods) && forcePeriods.length) {
                periods = forcePeriods.slice(0, 4);
            } else if (multi) {
                periods = mpPeriods();
                if (periods.length < 2) { showError('多周期模式请至少勾选 2 个周期'); return; }
            }
            const initialCash = parseInt(document.getElementById('initial-cash').value);
            const commission = parseFloat(document.getElementById('commission').value) || 0.001;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results-section').classList.remove('show');
            document.getElementById('error-message').style.display = 'none';
            scrollToEl('loading');   // 点击后跳到进度/结果位置
            const btn = document.getElementById('run-backtest');
            const btnAll = document.getElementById('run-all');
            btn.disabled = true; btnAll.disabled = true;
            const loadText = document.getElementById('loading-text');

            const jobs = [];
            for (const st of stocks) for (const it of items) for (const pd of periods) jobs.push({ st, it, pd });
            const total = jobs.length;
            const results = [];
            let done = 0;
            const t0 = performance.now();
            try {
                for (const j of jobs) {
                    done++;
                    let eta = '';
                    if (done > 1) {
                        const per = (performance.now() - t0) / (done - 1);
                        eta = ` · 剩余约 ${Math.max(1, Math.round((total - done) * per / 1000))}s`;
                    }
                    loadText.textContent = `正在回测（${done}/${total}）：${j.st.name} × ${j.it.display} × ${PERIOD_LABELS[j.pd]} ...${eta}`;
                    const body = { code: j.st.code, initial_cash: initialCash, engine: j.it.engine, period: j.pd, commission };
                    if (j.it.engine !== 'zipline') body.strategy = j.it.name;
                    if (j.it.params) body.params = j.it.params;
                    let result;
                    try {
                        const response = await fetch(`/api/backtest/run?pwd=${pwd}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        result = await response.json();
                        if (!response.ok && !result.error) result = { success: false, error: result.detail || `HTTP ${response.status}` };
                    } catch (e) {
                        result = { success: false, error: '网络错误: ' + e.message };
                    }
                    results.push({ ...j.it, st: j.st, p: j.pd, result, key: `${j.st.code}|${j.pd}|${j.it.name}|${j.it.variant || ''}` });
                }
                const failed = results.filter(r => !r.result.success);
                if (failed.length === results.length) {
                    showError(failed[0].result.error || '回测失败');
                } else {
                    displayResults(results, periods);
                    saveHistory(results, periods);
                    if (failed.length) {
                        showError(`${failed.length} 个组合回测失败（${failed[0].result.error || '未知错误'}），其余已展示`);
                    }
                }
            } finally {
                document.getElementById('loading').style.display = 'none';
                btn.disabled = false; btnAll.disabled = false;
                const resSec = document.getElementById('results-section');
                const errEl = document.getElementById('error-message');
                if (resSec.classList.contains('show')) scrollToEl('results-section');
                else if (errEl.style.display !== 'none') scrollToEl('error-message');
            }
        }

        // 常规回测：已选 chips × 已勾选策略
        function runBacktest() {
            if (!selStocks.length) { showError('请先加入至少一只股票'); return; }
            if (!picked.size) { showError('请至少选择一个策略'); return; }
            return runJobs(selStocks.slice(), [...picked.values()]);
        }

        // 全量回测：所有候选股票 × 所有策略（含变体），无视勾选
        function runAllBacktest() {
            const stocks = allStocksFromSelect();
            const items = allStrategyItems();
            if (!stocks.length) { showError('没有可回测的股票'); return; }
            if (!items.length) { showError('没有可回测的策略'); return; }
            const total = stocks.length * items.length;
            const pds = document.getElementById('multi-period').checked ? mpPeriods() : [document.getElementById('period-select').value];
            const totalAll = total * pds.length;
            const pTxt = pds.length > 1 ? ` × ${pds.length}个周期（${pds.map(k => PERIOD_LABELS[k]).join('+')}）` : '';
            if (!confirm(`全量回测：${stocks.length} 只股票 × ${items.length} 个策略${pTxt} = ${totalAll} 个组合，串行执行预计约 ${(totalAll * 2 / 60).toFixed(1)} 分钟。\n\n确定开始？`)) return;
            return runJobs(stocks, items);
        }

        // 指标行定义: 取数 + 最优方向(用于高亮) + 格式化
        const CMP_ROWS = [
            { key: 'total_return', label: '总收益率', max: true, fmt: v => `${v >= 0 ? '+' : ''}${v}%`, cls: v => v >= 0 ? 'pos' : 'neg' },
            { key: 'annual_return', label: '年化收益', max: true, fmt: v => `${v >= 0 ? '+' : ''}${v}%`, cls: v => v >= 0 ? 'pos' : 'neg' },
            { key: 'final_value', label: '最终价值', max: true, fmt: v => `¥${Number(v).toLocaleString()}` },
            { key: 'sharpe_ratio', label: '夏普比率', max: true, fmt: v => v },
            { key: 'max_drawdown', label: '最大回撤%', max: false, fmt: v => `${v}%`, cls: () => 'neg' },
            { key: 'win_rate', label: '胜率', max: true, fmt: v => `${v}%` },
            { key: 'total_trades', label: '交易次数', max: null, fmt: v => v },
        ];

        function cmpTableHtml(ok, periodLabel) {
            const multiP = new Set(ok.map(r => r.p || '1d')).size > 1;
            let html = `<div class="cmp-wrap"><table class="cmp-table"><thead><tr><th>指标</th>`;
            html += ok.map(r => `<th>${r.display}${multiP ? `<span class="eng-tag backtrader">${PERIOD_LABELS[r.p] || r.p}</span>` : ''}<span class="eng-tag ${r.engine}">${r.engine === 'backtrader' ? 'BT' : r.engine}</span></th>`).join('');
            html += `</tr></thead><tbody>`;
            for (const row of CMP_ROWS) {
                const vals = ok.map(r => Number(r.result[row.key]) || 0);
                let bestIdx = -1;
                if (row.max === true) bestIdx = vals.indexOf(Math.max(...vals));
                if (row.max === false) bestIdx = vals.indexOf(Math.max(...vals.map(v => -Math.abs(v))));  // 回撤越小越好
                html += `<tr><td>${row.label}</td>`;
                html += ok.map((r, i) => {
                    const v = r.result[row.key];
                    const cls = [row.cls ? row.cls(Number(v) || 0) : '', i === bestIdx && ok.length > 1 ? 'best' : ''].filter(Boolean).join(' ');
                    const star = i === bestIdx && ok.length > 1 ? ' ★' : '';
                    return `<td class="${cls}">${row.fmt(v)}${star}</td>`;
                }).join('');
                html += `</tr>`;
            }
            html += `</tbody></table></div>`;
            if (periodLabel) html += `<p style="color:#64748b;font-size:12px;margin:0 0 16px;">同周期、同资金与手续费口径；★ 为该指标最优策略（${periodLabel}）。</p>`;
            return html;
        }

        function renderCompare(results, periods) {
            const ok = results.filter(r => r.result.success);
            const wrap = document.getElementById('compare-wrap');
            _mtxs = {};
            if (!ok.length) { wrap.innerHTML = ''; return; }
            const pKeys = periods.length > 1 ? periods : [...new Set(ok.map(r => r.p || '1d'))];
            const multip = pKeys.length > 1;
            const pLabel = pKeys.map(k => PERIOD_LABELS[k] || k).join(' / ');
            const stockCodes = [...new Set(ok.map(r => r.st.code))];
            let html = '';
            const strats = [];
            ok.forEach(r => {
                const k = `${r.name}|${r.variant || ''}`;
                if (!strats.some(s => s.key === k)) strats.push({ key: k, display: r.display });
            });
            const buildMtx = (sub, id) => {
                const byStock = {};
                const sts = {};
                const codes = [...new Set(sub.map(r => r.st.code))];
                codes.forEach(c => { byStock[c] = {}; sts[c] = sub.find(r => r.st.code === c).st; });
                sub.forEach(r => {
                    byStock[r.st.code][strats.findIndex(s => s.key === `${r.name}|${r.variant || ''}`)] = r;
                });
                _mtxs[id] = { strats, byStock, sts, orig: codes.slice(), col: -1, dir: 0 };
                return `<div class="mtx-wrap" id="${id}"></div>`;
            };
            if (multip) {
                // 周期对比摘要：每个周期的最优组合与平均收益
                const rows = pKeys.map(k => {
                    const sub = ok.filter(r => (r.p || '1d') === k);
                    if (!sub.length) return '';
                    const best = sub.reduce((a, b) => Number(b.result.total_return) > Number(a.result.total_return) ? b : a);
                    const avg = sub.reduce((s, r) => s + (Number(r.result.total_return) || 0), 0) / sub.length;
                    return `<tr><td>${PERIOD_LABELS[k] || k}</td><td>${best.st.name} × ${best.display}<span class="eng-tag ${best.engine}">${best.engine === 'backtrader' ? 'BT' : best.engine}</span></td><td class="${Number(best.result.total_return) >= 0 ? 'pos' : 'neg'}">${best.result.total_return >= 0 ? '+' : ''}${best.result.total_return}%</td><td>${avg >= 0 ? '+' : ''}${avg.toFixed(2)}%</td></tr>`;
                }).join('');
                const bestP = pKeys.map(k => {
                    const sub = ok.filter(r => (r.p || '1d') === k);
                    return sub.length ? Math.max(...sub.map(r => Number(r.result.total_return))) : -Infinity;
                });
                const champIdx = bestP.indexOf(Math.max(...bestP));
                html += `<div class="cmp-stock-title">周期对比摘要（★ = 最优周期：${PERIOD_LABELS[pKeys[champIdx]] || ''}）</div>
                    <div class="cmp-wrap"><table class="cmp-table"><thead><tr><th>周期</th><th>最优组合</th><th>最优收益</th><th>平均收益</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            }
            if (stockCodes.length > 1) {
                if (!multip) {
                    html += `<div class="cmp-stock-title">交叉对比 · 总收益率（股票 × 策略，★ = 全场最优，<span style="color:#64748b;">点列头可按该策略排序</span>）</div>` + buildMtx(ok, 'mtx-wrap');
                    const heavy = ok.length > 24;
                    if (!heavy) {
                        stockCodes.forEach(c => {
                            const st = _mtxs['mtx-wrap'].sts[c];
                            const sub = ok.filter(r => r.st.code === c);
                            if (sub.length > 1) html += `<div class="cmp-stock-title">${st.name} (${c})</div>` + cmpTableHtml(sub, pLabel);
                        });
                    } else {
                        html += `<div class="cmp-stock-title" style="color:#64748b;font-weight:400;">共 ${ok.length} 个组合，已省略每股明细对比表 — 可点击矩阵列头按该策略收益率排序，快速定位最优股票/策略</div>`;
                    }
                } else {
                    // 多周期：每个周期一张矩阵（同结构可横向对照），明细表省略
                    pKeys.forEach((k, pi) => {
                        const sub = ok.filter(r => (r.p || '1d') === k);
                        if (!sub.length) { html += `<div class="cmp-stock-title">${PERIOD_LABELS[k] || k}：无成功组合</div>`; return; }
                        html += `<div class="cmp-stock-title">交叉对比 · 总收益率（${PERIOD_LABELS[k] || k}，★ = 该周期最优，<span style="color:#64748b;">点列头可按该策略排序</span>）</div>` + buildMtx(sub, `mtx-${pi}`);
                    });
                    html += `<div class="cmp-stock-title" style="color:#64748b;font-weight:400;">多周期模式已省略每股明细对比表 — 各周期矩阵列结构一致，上下对照即可看出同一股票/策略在不同周期下的差异</div>`;
                }
            } else if (ok.length > 1 && !multip) {
                html = cmpTableHtml(ok, pLabel);
            } else if (ok.length > 1 && multip) {
                // 单股票多周期：一张 策略×周期 对比表（保留上方周期摘要）
                html += cmpTableHtml(ok, pLabel);
            }
            wrap.innerHTML = html;
            Object.keys(_mtxs).forEach(id => renderMtx(id));
        }

        // ===== 交叉矩阵：多实例状态 + 列排序（单周期 id='mtx-wrap'，多周期 id='mtx-0'/'mtx-1'…）=====
        let _mtxs = {};
        function mtxSortCol(i, id) {
            const m = _mtxs[id];
            if (!m) return;
            if (m.col !== i) { m.col = i; m.dir = 1; }
            else if (m.dir === 1) { m.dir = -1; }
            else { m.col = -1; m.dir = 0; }
            renderMtx(id);
        }
        function renderMtx(id) {
            const el = document.getElementById(id);
            const M = _mtxs[id];
            if (!el || !M) return;
            const { strats, byStock, sts } = M;
            let rows = M.orig.slice();
            if (M.col >= 0 && M.dir) {
                rows.sort((a, b) => {
                    const ra = byStock[a][M.col], rb = byStock[b][M.col];
                    const va = ra && ra.result.success ? Number(ra.result.total_return) : null;
                    const vb = rb && rb.result.success ? Number(rb.result.total_return) : null;
                    if (va === null && vb === null) return 0;
                    if (va === null) return 1;
                    if (vb === null) return -1;
                    return M.dir === 1 ? vb - va : va - vb;
                });
            }
            let globalBest = -Infinity, gbKey = '';
            rows.forEach(c => strats.forEach((s, si) => {
                const r = byStock[c][si];
                if (!r || !r.result.success) return;
                const v = Number(r.result.total_return);
                if (v > globalBest) { globalBest = v; gbKey = `${c}|${si}`; }
            }));
            const arrow = i => M.col === i ? (M.dir === 1 ? ' ↓' : M.dir === -1 ? ' ↑' : '') : '';
            el.innerHTML = `<table class="mtx-table"><thead><tr><th>股票 \\ 策略</th>${strats.map((s, i) =>
                `<th class="sortable${M.col === i ? ' on' : ''}" onclick="mtxSortCol(${i},'${id}')" title="点击按该策略收益率排序">${s.display}${arrow(i)}</th>`).join('')}</tr></thead><tbody>` +
                rows.map(c => {
                    const st = sts[c];
                    let tr = `<tr><td class="rowh">${st.name}<small style="color:#64748b;font-weight:400;"> ${c}</small></td>`;
                    tr += strats.map((s, si) => {
                        const r = byStock[c][si];
                        if (!r || !r.result.success) return '<td style="color:#cbd5e1;">—</td>';
                        const v = Number(r.result.total_return) || 0;
                        const best = `${c}|${si}` === gbKey;
                        return `<td class="${v >= 0 ? 'pos' : 'neg'}${best ? ' best' : ''}">${v >= 0 ? '+' : ''}${v}%${best ? ' ★' : ''}</td>`;
                    }).join('');
                    return tr + '</tr>';
                }).join('') + '</tbody></table>';
        }
        
        // ===== 回测可视化：K线+买卖点+资金曲线 =====
        let btChart = null;
        let btChartResults = [];

        function buildBtChartOption(ch) {
            const RED = '#d92d20', GREEN = '#0b8f62';   // A股语义：红涨绿跌
            let lo = Infinity, hi = -Infinity;
            ch.ohlc.forEach(o => { if (o[2] < lo) lo = o[2]; if (o[3] > hi) hi = o[3]; });
            const pad = Math.max((hi - lo) * 0.035, 0.01);
            const eq0 = ch.equity[0] || 1;
            ch.eq0 = eq0;   // 供 y 轴 formatter 闭包引用
            // 资金轴精度自适应：收益波动极小的策略（±0.01%）也要能看出刻度差异
            const eqSpan = (Math.max(...ch.equity) - Math.min(...ch.equity)) / eq0 * 100;
            ch.eqDec = eqSpan >= 20 ? 0 : eqSpan >= 2 ? 1 : eqSpan >= 0.2 ? 2 : 3;
            const sigByDate = {};
            ch.signals.forEach(s => { (sigByDate[s.dt] = sigByDate[s.dt] || []).push(s); });
            const idxByDate = {};
            ch.dates.forEach((d, i) => { idxByDate[d] = i; });
            const buys = ch.signals.filter(s => s.type === 'buy').map(s => {
                const i = idxByDate[s.dt]; const low = i != null ? ch.ohlc[i][2] : s.price;
                return { value: [s.dt, low - pad], price: s.price };
            });
            const sells = ch.signals.filter(s => s.type !== 'buy').map(s => {
                const i = idxByDate[s.dt]; const high = i != null ? ch.ohlc[i][3] : s.price;
                return { value: [s.dt, high + pad], price: s.price };
            });
            return {
                animation: false,
                axisPointer: { link: [{ xAxisIndex: 'all' }] },
                tooltip: {
                    trigger: 'axis', confine: true, axisPointer: { type: 'cross' },
                    formatter: (params) => {
                        const di = params[0].dataIndex;
                        const dt = ch.dates[di];
                        let html = `<b>${dt}</b>`;
                        const o = ch.ohlc[di];
                        if (o) html += `<br/>开 ${o[0]}　收 ${o[1]}<br/>低 ${o[2]}　高 ${o[3]}`;
                        const eq = ch.equity[di];
                        if (eq != null) html += `<br/>账户：¥${Number(eq).toLocaleString()}`;
                        (sigByDate[dt] || []).forEach(s => {
                            const buy = s.type === 'buy';
                            html += `<br/><span style="color:${buy ? RED : GREEN};font-weight:700">${buy ? '▲ 买入' : '▼ 卖出'} @ ${s.price}</span>`;
                        });
                        return html;
                    }
                },
                grid: [
                    { left: 56, right: 14, top: 30, height: '50%' },
                    { left: 56, right: 14, top: '66%', height: '17%' },
                ],
                xAxis: [
                    { type: 'category', data: ch.dates, gridIndex: 0, boundaryGap: true, axisLine: { lineStyle: { color: '#cbd5e1' } }, axisTick: { show: false }, axisLabel: { show: false }, splitLine: { show: false } },
                    { type: 'category', data: ch.dates, gridIndex: 1, axisLine: { lineStyle: { color: '#cbd5e1' } }, axisTick: { show: false }, axisLabel: { fontSize: 10, color: '#64748b' }, splitLine: { show: false } },
                ],
                yAxis: [
                    { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: '#f1f5f9' } }, axisLabel: { fontSize: 10, color: '#64748b' } },
                    { scale: true, gridIndex: 1, splitLine: { show: false }, axisLabel: { fontSize: 10, color: '#64748b', formatter: (v) => { const p = (v / ch.eq0 - 1) * 100; return (p >= 0 ? '+' : '') + p.toFixed(ch.eqDec) + '%'; } } },
                ],
                dataZoom: [
                    { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
                    { type: 'slider', xAxisIndex: [0, 1], height: 16, bottom: 2, borderColor: 'transparent', fillerColor: 'rgba(102,126,234,0.10)', handleStyle: { color: '#8ea2ec' }, textStyle: { fontSize: 9, color: '#64748b' } },
                ],
                series: [
                    {
                        name: 'K线', type: 'candlestick', data: ch.ohlc,
                        itemStyle: { color: RED, color0: GREEN, borderColor: RED, borderColor0: GREEN },
                    },
                    {
                        name: '买入', type: 'scatter', data: buys, symbol: 'triangle', symbolSize: 12,
                        itemStyle: { color: RED }, z: 10,
                    },
                    {
                        name: '卖出', type: 'scatter', data: sells, symbol: 'triangle', symbolRotate: 180, symbolSize: 12,
                        itemStyle: { color: GREEN }, z: 10,
                    },
                    {
                        name: '账户资金', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
                        data: ch.equity, showSymbol: false,
