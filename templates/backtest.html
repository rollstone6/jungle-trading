                        lineStyle: { width: 1.6, color: '#2563eb' },
                        areaStyle: { opacity: 0.07, color: '#2563eb' },
                    },
                ],
            };
        }

        function renderBtCharts(results) {
            btChartResults = (results || []).filter(r => r.result && r.result.success
                && r.result.chart && r.result.chart.dates && r.result.chart.dates.length);
            if (btChartResults.length > 24) {
                // 组合过多时仅保留收益率前 24 的图表 tab，避免标签爆炸
                btChartResults.sort((a, b) => Number(b.result.total_return) - Number(a.result.total_return));
                btChartResults = btChartResults.slice(0, 24);
            }
            const tabs = document.getElementById('bt-chart-tabs');
            const wrap = document.getElementById('bt-chart-wrap');
            if (btChart) { btChart.dispose(); btChart = null; }
            if (!btChartResults.length) { tabs.innerHTML = ''; wrap.style.display = 'none'; return; }
            tabs.innerHTML = btChartResults.map((r, i) => {
                const multiStock = new Set(btChartResults.map(x => x.st.code)).size > 1;
                const multiP = new Set(btChartResults.map(x => x.p || '1d')).size > 1;
                const label = `${multiStock ? r.st.name + '·' : ''}${r.display}${multiP ? '·' + (PERIOD_LABELS[r.p] || '') : ''}`;
                return `<button class="bct-tab${i === 0 ? ' on' : ''}" onclick="switchBtChart(${i})">${label}</button>`;
            }).join('');
            wrap.style.display = 'block';
            btChart = echarts.init(document.getElementById('bt-chart-box'));
            btChart.setOption(buildBtChartOption(btChartResults[0].result.chart));
        }

        function switchBtChart(i) {
            if (!btChart || !btChartResults[i]) return;
            document.querySelectorAll('#bt-chart-tabs .bct-tab').forEach((el, j) => el.classList.toggle('on', j === i));
            btChart.setOption(buildBtChartOption(btChartResults[i].result.chart), true);
        }

        window.addEventListener('resize', () => { if (btChart) btChart.resize(); });

        // 显示结果
        function displayResults(results, periods) {
            periods = Array.isArray(periods) ? periods : [periods || '1d'];
            // 回测周期（个别引擎未返回时隐藏）
            const first = (results.find(r => r.result.success) || results[0]).result;
            const periodEl = document.getElementById('period-info');
            if (first.start_date && first.end_date) {
                const label = periods.length > 1 ? `多周期：${periods.map(k => PERIOD_LABELS[k] || k).join(' / ')}` : (PERIOD_LABELS[periods[0]] || '');
                const multi = results.length > 1 ? ` · ${results.length} 个组合对比` : '';
                periodEl.textContent =
                    `${label} · 回测区间：${first.start_date} ~ ${first.end_date} · ${first.total_days} 根K线${multi}`;
                periodEl.style.display = 'block';
            } else {
                periodEl.style.display = 'none';
            }

            renderCompare(results, periods);

            // 单策略时保留原 KPI 卡片；多组合时每个组合一张小卡组（标题带股票名/周期）
            const container = document.getElementById('results-grid');
            const multiStock = new Set(results.filter(r => r.result.success).map(r => r.st.code)).size > 1;
            const mpRes = new Set(results.filter(r => r.result.success).map(r => r.p || '1d')).size > 1;
            let okAll = results.filter(r => r.result.success);
            const capNote = okAll.length > 24;
            if (capNote) okAll = okAll.sort((a, b) => Number(b.result.total_return) - Number(a.result.total_return)).slice(0, 12);
            container.innerHTML = (capNote ? `<div style="width:100%;font-weight:700;font-size:14px;color:#334155;margin-bottom:4px;">明细卡片仅显示总收益率前 12 的组合（共 ${results.filter(r => r.result.success).length} 个成功组合，完整对比见上方矩阵）</div>` : '') + okAll.map(r => {
                const result = r.result;
                const metrics = [
                    { label: '初始资金', value: `¥${result.initial_cash.toLocaleString()}` },
                    { label: '最终价值', value: `¥${result.final_value.toLocaleString()}` },
                    { label: '总收益率', value: `${result.total_return}%`, className: result.total_return >= 0 ? 'positive' : 'negative' },
                    { label: '年化收益', value: `${result.annual_return || 0}%`, className: (result.annual_return || 0) >= 0 ? 'positive' : 'negative' },
                    { label: '夏普比率', value: result.sharpe_ratio || 0 },
                    { label: '最大回撤', value: `${result.max_drawdown}%`, className: 'negative' },
                    { label: '交易次数', value: result.total_trades || 0 },
                    { label: '胜率', value: `${result.win_rate}%` },
                ];
                const head = results.length > 1
                    ? `<div style="width:100%;font-weight:700;font-size:14px;color:#334155;margin-bottom:4px;">${multiStock ? r.st.name + ' · ' : ''}${r.display}${mpRes ? ' · ' + (PERIOD_LABELS[r.p] || '') : ''}</div>` : '';
                return head + metrics.map(m => `
                <div class="metric-card">
                    <div class="label">${m.label}</div>
                    <div class="value ${m.className || ''}">${m.value}</div>
                </div>
            `).join('');
            }).join('');
            
            document.getElementById('results-section').classList.add('show');
            // 图表必须在结果区可见后渲染，否则容器宽度为0导致 canvas 回退到 100px
            renderBtCharts(results);
        }
        
        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            document.getElementById('error-text').textContent = message;
            errorDiv.style.display = 'flex';
            scrollToEl('error-message');   // 常驻直到手动关闭或下次操作，不再5秒自动消失
        }
        document.getElementById('error-close').addEventListener('click', () => {
            document.getElementById('error-message').style.display = 'none';
        });

        // ===== 走势量化分类 =====
        const STRAT_NAME_MAP = {
            'ma': '均线交叉', 'macd': 'MACD策略', 'boll': '布林带均值回归',
            'boll_band': '布林带下买上卖',
            'boll_macd': '布林+MACD', 'ma_macd': '均线+MACD共振',
            'rsi_boll': 'RSI+布林', 'macd_vol': 'MACD+放量',
            'kdj': 'KDJ金叉死叉', 'kdj_macd': 'KDJ+MACD共振',
        };

        async function classifyRegime() {
            const code = (selStocks.length ? selStocks[selStocks.length - 1].code : (POOL.held[0] || POOL.pool[0] || {}).code || '');
            const period = document.getElementById('period-select').value;
            const group = document.getElementById('regime-group');
            const card = document.getElementById('regime-card');
            if (!code) { group.style.display = 'none'; return; }

            group.style.display = 'block';
            card.innerHTML = '<small style="color:#999">正在分析...</small>';
            try {
                const resp = await fetch(`/api/backtest/classify?pwd=${pwd}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, period })
                });
                const info = await resp.json();
                if (!resp.ok) throw new Error(info.detail || '分析失败');
                renderRegime(info);
            } catch (e) {
                card.innerHTML = `<small style="color:#c33">分类失败：${e.message}</small>`;
            }
        }

        function renderRegime(info) {
            const card = document.getElementById('regime-card');
            if (info.regime === 'unknown') {
                card.innerHTML = `<small style="color:#999">${info.note || info.reason}</small>`;
                return;
            }
            const chips = info.strategies.map(name => {
                const label = STRAT_NAME_MAP[name] || name;
                return `<button type="button" class="regime-chip" data-strategy="${name}">${label}</button>`;
            }).join('');
            card.innerHTML = `
                <span class="regime-badge ${info.regime}">${info.label}</span>
                <div class="regime-metrics">
                    <span>轨外运行比例 <b>${(info.outside_ratio * 100).toFixed(0)}%</b></span>
                    <span>带宽百分位 <b>${(info.bandwidth_pct * 100).toFixed(0)}%</b></span>
                    <span>布林带带宽 <b>${(info.bandwidth * 100).toFixed(1)}%</b></span>
                    <span>均线多头排列 <b>${info.bullish_align ? '是' : '否'}</b></span>
                    <span>偏离MA20 <b>${info.ma_dev_pct >= 0 ? '+' : ''}${info.ma_dev_pct}%</b></span>
                </div>
                <p class="regime-note">${info.note}</p>
                <div class="regime-chips">${chips}</div>
            `;
            // 点击推荐策略 chip -> 加入多选（已选则不取消，滚动定位）
            card.querySelectorAll('.regime-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const target = document.querySelector(`.strategy-card[data-name="${chip.dataset.strategy}"]`);
                    if (target) {
                        if (!picked.has(chip.dataset.strategy)) toggleCard(target, true);
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        showError('策略列表还没加载完，稍后再点');
                    }
                });
            });
        }
        
        // 初始化
        document.getElementById('run-backtest').addEventListener('click', runBacktest);
        document.getElementById('run-all').addEventListener('click', runAllBacktest);
        document.getElementById('period-select').addEventListener('change', classifyRegime);
        if (selStocks.length) classifyRegime();
        loadStrategies();
    </script>
</body>
</html>
